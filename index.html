<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convite Merlíah</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <main class="container">
    <div class="card">

      <!-- IMAGENS DECORATIVAS -->
      <img src="img/sereias.png" class="img-sereia">
      <img src="img/golfinho.png" class="img-golfinho">
      <img src="img/cavalo-marinho.png" class="img-cavalo">

      <h1>🧜‍♀️ Merlíah</h1>
      <h1 class="gold">faz 1 aninho! 🐚</h1>

      <p class="tema">Merlíah em vida de sereia 🌊</p>

      <p class="subtitle">
        Você está convidado para comemorar esse dia especial com a gente 💖
      </p>

      <div class="info">
        <p>📅 <strong>Data:</strong> 22 de março</p>
        <p>⏰ <strong>Horário:</strong> 15h</p>
        <p>📍 <strong>Local:</strong> rua da maquininha N.808 - Boiçucanga</p>
      </div>

      <hr>

      <h2>OBS: Levar fato de banho.</h2>
      <h2>Confirme sua presença</h2>

      <form id="form-confirmacao">
        <input type="text" id="nome" placeholder="Seu nome" required>

        <select id="presenca" required>
          <option value="">Você vai comparecer?</option>
          <option value="Sim">Sim 🎈</option>
          <option value="Não">Não 😢</option>
        </select>

        <!-- Mensagem de status fora do select -->
        <p id="mensagem-status"></p>

        <button type="submit">Confirmar presença</button>
      </form>

    </div>
  </main>
  <script src="js/confirmacao.js"></script>

</body>

</html>
